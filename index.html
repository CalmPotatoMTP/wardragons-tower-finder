<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>War Dragons Tower Finder</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 12px;

    background: #ffffff;
    color: #111;
    font-size: 16px;
}

/* Compact header */
h2 {
    font-size: 18px;
    margin: 8px 0 12px 0;
}

/* Controls stacked for mobile */
.controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
}

/* Dropdown */
select {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    width: 100%;
}

/* Button */
button {
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #2d6cdf;
    color: white;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

/* Results card style (important for iframe readability) */
#results {
    margin-top: 10px;
}

/* Table becomes mobile friendly */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 14px;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}

th {
    background: #f3f3f3;
}

/* Prevent horizontal overflow in iframe */
* {
    box-sizing: border-box;
}
</style>
<body>

<h2>War Dragons Tower Finder</h2>

<div class="controls">
    <select id="towerSelect"></select>
    <button onclick="search()">Find Highest</button>
</div>
<div id="results"></div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSlEUS6MDHupFoy3cmgAkBMrKudzYQr-3nJheF0WG6-f1rGhrBf2DmROEx-H0YuWmFo1dfF4dIvg-N/pub?output=csv";

let data = [];
let headers = [];

async function loadData() {

    try {
        const res = await fetch(CSV_URL);
        const text = await res.text();

        const rows = text.trim().split("\n").map(r => r.split(","));

        headers = rows[0].map(h => h.replace(/"/g,"").trim());

        const towerSelect = document.getElementById("towerSelect");

        const startIndex = headers.indexOf("Team") + 1;

        for (let i = startIndex; i < headers.length; i++) {
            let opt = document.createElement("option");
            opt.value = headers[i];
            opt.textContent = headers[i];
            towerSelect.appendChild(opt);
        }

        data = rows.slice(1).map(r => {
            let obj = {};
            headers.forEach((h,i) => {
                obj[h] = (r[i] || "").replace(/"/g,"").trim();
            });
            return obj;
        });

        document.getElementById("results").innerHTML =
            "<p>Data loaded successfully.</p>";

    } catch (err) {
        document.getElementById("results").innerHTML =
            "<p style='color:red;'>Failed to load Google Sheet</p>";
        console.error(err);
    }
}

function search() {

    const tower = document.getElementById("towerSelect").value;

    let max = 0;

    data.forEach(d => {
        let val = Number(d[tower]) || 0;
        if (val > max) max = val;
    });

    const results = data.filter(d => Number(d[tower]) === max);

    let html = `<h3>Highest ${tower}: ${max}</h3>`;
    html += "<table><tr><th>Player/Base</th><th>Team</th><th>Value</th></tr>";

    results.forEach(r => {
        html += `<tr>
            <td>${r["Player Name"]}</td>
            <td>${r["Team"]}</td>
            <td>${r[tower]}</td>
        </tr>`;
    });

    html += "</table>";

    document.getElementById("results").innerHTML = html;
}

loadData();

</script>

</body>
</html>
