<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Egg Mission Bases</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100%;
    background: #ffffff;
    color: #111;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 100%;
    padding: 12px;
    box-sizing: border-box;
}

h2 {
    font-size: 18px;
    margin: 8px 0 12px 0;
}

.controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
}

select, button {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    box-sizing: border-box;
}

select {
    border: 1px solid #ccc;
}

button {
    border: none;
    background: #2d6cdf;
    color: white;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

#results {
    width: 100%;
    margin-top: 10px;
}

.card {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-top: 10px;
    background: #fff;
    overflow: hidden;
}

.card-header {
    padding: 12px;
    font-weight: bold;
    background: #f3f3f3;
    cursor: pointer;
}

.card-body {
    display: none;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
}

.card-body div {
    padding: 2px 0;
}

* {
    box-sizing: border-box;
}

</style>
</head>

<body>

<div class="container">

<h2>Egg Mission Bases</h2>

<div class="controls">
    <select id="towerSelect">
        <option value="" selected disabled>Select desired tower type to begin searching</option>
    </select>
    <button id="searchBtn" onclick="search()">Find Bases</button>
</div>

<div id="results"></div>

</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSlEUS6MDHupFoy3cmgAkBMrKudzYQr-3nJheF0WG6-f1rGhrBf2DmROEx-H0YuWmFo1dfF4dIvg-N/pub?output=csv";

let data = [];
let headers = [];
let towers = [];

async function loadData() {

    const res = await fetch(CSV_URL);
    const text = await res.text();

    const rows = text.trim().split("\n").map(r => r.split(","));

    headers = rows[0].map(h => h.replace(/"/g, "").trim());

    const towerSelect = document.getElementById("towerSelect");

    const startIndex = headers.indexOf("Team") + 1;
    towers = headers.slice(startIndex);

    const groups = {
        "Empty Bases": [],
        "Turrets": [],
        "Flaks": [],
        "Electrum Towers": [],
        "Wood Towers": []
    };

    towers.forEach(t => {

        if (t.includes("Turret")) {
            groups["Turrets"].push(t);
        }
        else if (t.includes("Flak")) {
            groups["Flaks"].push(t);
        }
        else if (t.includes("Storm Tower") || t.includes("Lightning")) {
            groups["Wood Towers"].push(t);
        }
        else {
            groups["Electrum Towers"].push(t);
        }
    });

    Object.keys(groups).forEach(g => {
        groups[g].sort((a, b) => a.localeCompare(b));
    });

    const emptyOpt = document.createElement("option");
    emptyOpt.value = "__EMPTY_BASES__";
    emptyOpt.textContent = "Empty Bases (0 Towers)";
    towerSelect.appendChild(emptyOpt);

    const order = ["Turrets", "Flaks", "Electrum Towers", "Wood Towers"];

    order.forEach(groupName => {

        const optgroup = document.createElement("optgroup");
        optgroup.label = groupName;

        groups[groupName].forEach(tower => {
            const opt = document.createElement("option");
            opt.value = tower;
            opt.textContent = tower;
            optgroup.appendChild(opt);
        });

        towerSelect.appendChild(optgroup);
    });

    document.getElementById("towerSelect").selectedIndex = 0;

    data = rows.slice(1).map(r => {
        let obj = {};
        headers.forEach((h, i) => {
            obj[h] = (r[i] || "").replace(/"/g, "").trim();
        });
        return obj;
    });
}

function search() {

    const selected = document.getElementById("towerSelect").value;

    let results = [];

    if (selected === "__EMPTY_BASES__") {

        results = data.filter(d =>
            towers.every(t => Number(d[t]) === 0)
        );

    } else {

        let max = 0;

        data.forEach(d => {
            const val = Number(d[selected]) || 0;
            if (val > max) max = val;
        });

        results = data.filter(d => Number(d[selected]) === max);
    }

    let html = `<h3>Results</h3>`;

    results.forEach(player => {

        html += `
        <div class="card">

            <div class="card-header" onclick="toggle(this)">
                ▼ ${player["Player Name"]} (${player["Team"]})
            </div>

            <div class="card-body">
        `;

        headers.slice(headers.indexOf("Team") + 1).forEach(t => {
            html += `<div><b>${t}:</b> ${player[t] || 0}</div>`;
        });

        html += `
            </div>
        </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
}

function toggle(el) {
    const body = el.nextElementSibling;
    body.style.display = body.style.display === "block" ? "none" : "block";
}

loadData();

</script>

</body>
</html>
